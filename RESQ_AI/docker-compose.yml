# Optional deployment: docker compose up --build   (frontend: http://localhost:8080, API: http://localhost:8000)
# NOTE: written for deployment readiness; not tested in the prototype environment.
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env.example     # copy to backend/.env and change the secrets for real use
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - resq_data:/data                # database lives in a volume, survives rebuilds
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { VITE_API_BASE_URL: http://localhost:8000 }
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  resq_data:
